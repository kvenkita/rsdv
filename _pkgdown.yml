    link-color: "#2171b5"
    code-color: "#c0392b"
    code-bg: "#f6f9fc"

navbar:
  left:
    - text: "Reference"
      href: reference/index.html
    - text: "Articles"
      menu:
        - text: "Getting Started"
          href: articles/getting-started.html
