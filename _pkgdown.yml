url: https://kvenkita.github.io/rsdv
template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#2171b5"
    link-color: "#2171b5"
    code-color: "#c0392b"
    code-bg: "#f6f9fc"

navbar:
  left:
    - text: "Reference"
      href: reference/index.html
    - text: "Articles"
      menu:
        - text: "Getting Started"
          href: articles/getting-started.html
        - text: "Migrating from synthpop"
          href: articles/migrating-from-synthpop.html

reference:
  - title: "Metadata"
    contents: [metadata, set_column_type, set_primary_key,
               print.rsdv_metadata,
               metadata_to_json, metadata_from_json, save_metadata, load_metadata]
  - title: "Constraints"
    contents: [add_constraint, equality_constraint, inequality_constraint,
               fixed_combinations_constraint, custom_constraint,
               check_constraint, check_constraints]
  - title: "Synthesizers"
    contents: [gaussian_copula_synthesizer, fit, sample, sample_conditions,
               is_fitted, validate_data]
  - title: "Evaluation"
    contents: [quality_report, print.rsdv_quality_report, autoplot.rsdv_quality_report,
               diagnostic_report, print.rsdv_diagnostic_report, autoplot.rsdv_diagnostic_report,
               privacy_report, print.rsdv_privacy_report, autoplot.rsdv_privacy_report,
               ks_similarity, tvd_similarity, correlation_similarity,
               contingency_similarity, ml_efficacy,
               nndr, attribute_disclosure_risk]
  - title: "Data"
    contents: [adult_income]
