  - title: "Constraints"
    contents: [add_constraint, equality_constraint, inequality_constraint,
               fixed_combinations_constraint, custom_constraint, check_constraints]
  - title: "Synthesizers"
    contents: [gaussian_copula_synthesizer, fit, sample, is_fitted, validate_data]
  - title: "Evaluation"
    contents: [quality_report, privacy_report,
